<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soni Gallery</title>
  <style>
    :root {
      --stone-1: #f0e7d8;
      --stone-2: #d7c3a2;
      --brick-1: #684a3a;
      --brick-2: #7d5643;
      --brick-3: #926655;
      --wood-1: #7c4924;
      --wood-2: #a8672d;
      --metal: #2a2f32;
      --grass: #7aa15c;
      --shadow: rgba(27, 18, 13, 0.24);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      background: #d4d0c9;
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
    }

    .landing {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: url('assets/Background_index.png') center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .enter-label {
      position: relative;
      z-index: 1;
      padding: 14px 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #ffffff;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="landing" id="landing" aria-label="Artwork gallery intro screen">
    <div class="enter-label">Click to Enter the Gallery</div>
  </div>

  <script>
    const landing = document.getElementById('landing');

    landing.addEventListener('click', () => {
      landing.classList.add('opening');
      setTimeout(() => {
        window.location.href = 'art_gallery.html';
      }, 200);
    });
  </script>
</body>
</html>
