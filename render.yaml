services:
  - type: web
    name: art-gallery
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q .
    startCommand: python server.py
    healthCheckPath: /api/paintings
    disk:
      name: art-gallery-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_PASSWORD
        sync: false