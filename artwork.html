<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f1eee7" />
  <title>Artwork | Soni Gallery</title>
  <link rel="stylesheet" href="./assets/css/artwork.css" />
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="./art_gallery.html" aria-label="Back to the gallery">
      <span aria-hidden="true">←</span> Gallery
    </a>
    <a class="wordmark" href="./index.html">SONI <span>GALLERY</span></a>
    <span class="header-note">A closer look</span>
  </header>

  <main id="artworkPage" class="artwork-page" aria-live="polite">
    <p class="loading-message">Loading artwork...</p>
  </main>

  <dialog class="inquiry-dialog" id="inquiryDialog" aria-labelledby="inquiryTitle">
    <div class="inquiry-dialog-header">
      <div>
        <p class="eyebrow">Artwork inquiry</p>
        <h2 id="inquiryTitle">Ask about this work</h2>
      </div>
      <button class="inquiry-close" id="closeInquiryButton" type="button" aria-label="Close inquiry form">×</button>
    </div>
    <p class="inquiry-artwork" id="inquiryArtwork"></p>
    <p class="inquiry-note">Your email app will open with the inquiry addressed to the gallery and copied to you.</p>
    <p class="inquiry-status" id="inquiryStatus" role="status" aria-live="polite"></p>
    <form class="inquiry-form" id="inquiryForm">
      <div class="inquiry-fields">
        <label class="inquiry-field">
          <span>Name</span>
          <input name="name" autocomplete="name" required />
        </label>
        <label class="inquiry-field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label class="inquiry-field inquiry-field-full">
          <span>Phone</span>
          <input name="phone" type="tel" autocomplete="tel" required />
        </label>
        <label class="inquiry-field inquiry-field-full">
          <span>Comments</span>
          <textarea name="comments" rows="4" required></textarea>
        </label>
      </div>
      <div class="inquiry-actions">
        <button class="inquiry-cancel" id="cancelInquiryButton" type="button">Cancel</button>
        <button class="inquiry-submit" type="submit">Open email</button>
      </div>
    </form>
  </dialog>

  <script src="./assets/js/gallery-data.js"></script>
  <script src="./assets/js/artwork.js"></script>
</body>
</html>
